# Render Blueprint: one Docker web service + one Postgres database.
# Render > New > Blueprint > pick this repository. You are asked for the two secrets marked sync:false.
databases:
  - name: ceda-portal-db
    plan: free
    databaseName: fundinglens
    user: fundinglens
services:
  - type: web
    name: ceda-innovation-portal
    runtime: docker
    plan: free
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass   # deploy only after GitHub CI is green
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ceda-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: DEFAULT_INSTITUTION_NAME
        value: CEDA Innovation Management Portal (Prototype)
